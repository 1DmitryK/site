<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Immigrity — Your Move, Simplified</title>

  <meta name="description" content="Personalised relocation checklists for immigrants. Move to the UK, Germany, Canada and more with step-by-step visa and settlement guides." />
  <meta name="keywords" content="immigration guide, moving to UK, moving to Germany, relocation checklist, visa support, immigrant tools" />
  <meta property="og:title" content="Immigrity — Relocate Step-by-Step" />
  <meta property="og:description" content="Built by immigrants, for immigrants. Get your free personalised move-abroad checklist." />
  <meta property="og:type" content="website" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f1e8;
      --card: #ffffff;
      --ink: #141210;
      --muted: #6f6659;
      --line: rgba(20,18,16,.1);
      --accent: #c74a2f;
      --done: #2b7a4b;
      --shadow: 0 12px 28px rgba(20,18,16,.08);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: 'DM Sans', sans-serif; line-height: 1.6;
    }

    .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(246, 241, 232, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 15px 0;
    }

    .header-content { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; cursor: pointer; }
    .logo span { color: var(--accent); }

    .hero { text-align: center; padding: 60px 0 40px; }
    h1 { 
      font-family: 'Fraunces', serif; font-size: clamp(32px, 8vw, 64px); 
      font-weight: 300; margin-bottom: 20px; line-height: 1.1;
    }
    h1 em { color: var(--accent); font-style: italic; }

    .selector-card {
      background: var(--card); border-radius: 24px; padding: 30px;
      box-shadow: var(--shadow); border: 1px solid var(--line);
      margin-bottom: 40px;
    }

    .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 15px; }

    .grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
    .pill {
      padding: 12px 20px; border-radius: 99px; border: 1.5px solid var(--line);
      background: #fff; cursor: pointer; font-weight: 700; transition: 0.2s;
    }
    .pill:hover { border-color: var(--accent); }
    .pill.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .phase { margin-bottom: 30px; }
    .phase-title { font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .phase-num { background: var(--ink); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }

    .item {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; margin-bottom: 12px; display: flex; gap: 15px;
      cursor: pointer; transition: 0.2s;
    }
    .item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .item.checked { background: #f0fdf4; border-color: var(--done); opacity: 0.8; }
    
    .checkbox { width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 6px; flex-shrink: 0; position: relative; }
    .item.checked .checkbox { background: var(--done); border-color: var(--done); }
    .item.checked .checkbox::after { content: '✓'; color: #fff; position: absolute; left: 4px; top: -2px; font-weight: bold; }

    .item-content strong { display: block; font-size: 16px; }
    .item-content p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }

    .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; border: 1px solid currentColor; margin-top: 8px; display: inline-block; }
    .tag.urgent { color: var(--accent); background: rgba(199, 74, 47, 0.1); }
    .tag.info { color: #2563eb; background: rgba(37, 99, 235, 0.1); }

    .lang-switcher button {
      background: none; border: 1px solid var(--line); padding: 5px 10px;
      border-radius: 5px; cursor: pointer; font-weight: 700; margin-left: 5px;
    }
    .lang-switcher button.active { background: var(--ink); color: #fff; }

    footer { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }

    [style*="display: none"] { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="wrap header-content">
      <div class="logo" onclick="location.reload()">Immigri<span>ty</span></div>
      <div class="lang-switcher">
        <button onclick="setLang('en')" id="btn-en" class="active">EN</button>
        <button onclick="setLang('uk')" id="btn-uk">UK</button>
        <button onclick="setLang('ru')" id="btn-ru">RU</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 id="hero-text">Your move to <br><em>the world,</em><br> step by step.</h1>
      <p id="hero-subtext">Personalised relocation checklists built by immigrants, for immigrants.</p>
    </section>

    <div class="selector-card">
      <div class="label" id="label-moving-to">I'm moving to</div>
      <div class="grid" id="dest-grid"></div>

      <div id="origin-section" style="display: none;">
        <div class="label" id="label-coming-from">I'm coming from</div>
        <div class="grid" id="origin-grid"></div>
      </div>
    </div>

    <div id="checklist-container"></div>
  </main>

  <footer>
    <p>&copy; 2026 Immigrity — Your Move, Simplified.</p>
  </footer>

  <script>
    const translations = {
      en: {
        hero: "Your move to <br><em>{country},</em><br> step by step.",
        subtext: "Personalised relocation checklists built by immigrants, for immigrants.",
        movingTo: "I'm moving to",
        comingFrom: "I'm coming from",
        world: "the world",
        phases: { docs: "Documents & Visa", arrival: "First Week", life: "Settling In" }
      },
      uk: {
        hero: "Ваш переїзд до <br><em>{country},</em><br> крок за кроком.",
        subtext: "Персоналізовані чек-листи для релокації, створені іммігрантами для іммігрантів.",
        movingTo: "Я переїжджаю до",
        comingFrom: "Я приїжджаю з",
        world: "світу",
        phases: { docs: "Документи та Віза", arrival: "Перший тиждень", life: "Облаштування" }
      },
      ru: {
        hero: "Ваш переезд в <br><em>{country},</em><br> шаг за шагом.",
        subtext: "Персонализированные чек-листы для релокации, созданные иммигрантами для иммигрантов.",
        movingTo: "Я переезжаю в",
        comingFrom: "Я еду из",
        world: "мир",
        phases: { docs: "Документы и Виза", arrival: "Первая неделя", life: "Обустройство" }
      }
    };

    const destinations = [
      { code: 'UK', name: { en: 'United Kingdom', uk: 'Великої Британії', ru: 'Великобританию' }, flag: '🇬🇧' },
      { code: 'DE', name: { en: 'Germany', uk: 'Німеччини', ru: 'Германию' }, flag: '🇩🇪' },
      { code: 'CA', name: { en: 'Canada', uk: 'Канади', ru: 'Канаду' }, flag: '🇨🇦' }
    ];

    const origins = [
      { code: 'UA', name: { en: 'Ukraine', uk: 'України', ru: 'Украины' }, flag: '🇺🇦' },
      { code: 'IN', name: { en: 'India', uk: 'Індії', ru: 'Индии' }, flag: '🇮🇳' },
      { code: 'OTHER', name: { en: 'Other', uk: 'Іншої країни', ru: 'Другой страны' }, flag: '🌍' }
    ];

    const checklists = {
      UK: {
        UA: [
          { phase: 'docs', items: [
            { title: "Homes for Ukraine Scheme", desc: "Check your eligibility and extension status for 2026.", tag: "urgent" },
            { title: "BRP / e-Visa", desc: "Ensure your biometric residence permit or digital status is ready.", tag: "urgent" }
          ]},
          { phase: 'arrival', items: [
            { title: "GP Registration", desc: "Register with a local doctor to access NHS services.", tag: "info" },
            { title: "BRP Collection", desc: "Collect your permit from the designated Post Office if applicable.", tag: "urgent" }
          ]}
        ],
        DEFAULT: [
          { phase: 'docs', items: [
            { title: "Skilled Worker Visa", desc: "Confirm your Certificate of Sponsorship (CoS) from your employer.", tag: "urgent" }
          ]}
        ]
      },
      DE: {
        DEFAULT: [
          { phase: 'docs', items: [
            { title: "National Visa (D)", desc: "Apply at the German embassy in your current country.", tag: "urgent" }
          ]},
          { phase: 'arrival', items: [
            { title: "Anmeldung", desc: "Register your address at the Bürgeramt within 14 days.", tag: "urgent" },
            { title: "Health Insurance", desc: "Sign up for public (AOK, TK) or private insurance.", tag: "urgent" }
          ]}
        ]
      },
      CA: {
        DEFAULT: [
          { phase: 'docs', items: [
            { title: "PR / Work Permit", desc: "Ensure you have your Letter of Introduction for the border officer.", tag: "urgent" }
          ]},
          { phase: 'arrival', items: [
            { title: "SIN Number", desc: "Apply for your Social Insurance Number at Service Canada.", tag: "urgent" },
            { title: "Health Card", desc: "Apply for provincial health coverage (OHIP, MSP, etc.).", tag: "info" }
          ]}
        ]
      }
    };

    let currentLang = 'en';
    let selectedDest = null;
    let selectedOrigin = null;

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-switcher button').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${lang}`).classList.add('active');
      updateUI();
    }

    function updateUI() {
      const t = translations[currentLang];
      const countryName = selectedDest ? destinations.find(d => d.code === selectedDest).name[currentLang] : t.world;
      
      document.getElementById('hero-text').innerHTML = t.hero.replace('{country}', countryName);
      document.getElementById('hero-subtext').innerText = t.subtext;
      document.getElementById('label-moving-to').innerText = t.movingTo;
      document.getElementById('label-coming-from').innerText = t.comingFrom;

      renderDestinations();
      if (selectedDest === 'UK') {
        document.getElementById('origin-section').style.display = 'block';
        renderOrigins();
      } else {
        document.getElementById('origin-section').style.display = 'none';
      }
      renderChecklist();
    }

    function renderDestinations() {
      const grid = document.getElementById('dest-grid');
      grid.innerHTML = destinations.map(d => `
        <button class="pill ${selectedDest === d.code ? 'active' : ''}" onclick="selectDest('${d.code}')">
          ${d.flag} ${d.name[currentLang] || d.name.en}
        </button>
      `).join('');
    }

    function renderOrigins() {
      const grid = document.getElementById('origin-grid');
      grid.innerHTML = origins.map(o => `
        <button class="pill ${selectedOrigin === o.code ? 'active' : ''}" onclick="selectOrigin('${o.code}')">
          ${o.flag} ${o.name[currentLang] || o.name.en}
        </button>
      `).join('');
    }

    function selectDest(code) {
      selectedDest = code;
      selectedOrigin = null;
      updateUI();
    }

    function selectOrigin(code) {
      selectedOrigin = code;
      updateUI();
    }

    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      if (!selectedDest) {
        container.innerHTML = '';
        return;
      }

      let data = checklists[selectedDest];
      if (selectedDest === 'UK' && selectedOrigin) {
        data = data[selectedOrigin] || data.DEFAULT;
      } else {
        data = data.DEFAULT || data;
      }

      const t = translations[currentLang];
      
      container.innerHTML = data.map((p, idx) => `
        <div class="phase">
          <div class="phase-title">
            <span class="phase-num">${idx + 1}</span>
            ${t.phases[p.phase] || p.phase}
          </div>
          ${p.items.map(item => `
            <div class="item" onclick="this.classList.toggle('checked')">
              <div class="checkbox"></div>
              <div class="item-content">
                <strong>${item.title}</strong>
                <p>${item.desc}</p>
                <span class="tag ${item.tag}">${item.tag}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    // Initialize
    updateUI();
  </script>
</body>
</html>
